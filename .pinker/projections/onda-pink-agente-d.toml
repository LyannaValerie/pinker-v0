[[rules]]
op = "override-region"
key = "ast.closures.identificadores-livres"
from_hash = "fnv1a64:b2e5a7bf5b9fb4f6"
to_hash = "fnv1a64:9f42348c66b7ddab"
from_summary = "Fase 243: varredura sintática pura (sem informação de tipo) que lista, em ordem determinística de primeira referência, os identificadores usados em posição de valor no corpo de uma função que não são parâmetros nem locais `nova` declarados antes do uso no mesmo escopo léxico (block-scoped). A consulta simples usada pelo parser mantém nomes de callee direto fora; a consulta transitiva usada por semantic/IR inclui esses nomes como candidatos para distinguir callables locais capturados de funções top-level. Cabe ao chamador filtrar candidatos que não resolvem para binding local."
to_summary = "Fase 243: varredura sintática pura (sem informação de tipo) que lista, em ordem determinística de primeira referência, os identificadores usados em posição de valor no corpo de uma função que não são parâmetros nem locais `nova` declarados antes do uso no mesmo escopo léxico (block-scoped). Nome de callee direto em `Call(Ident(nome), args)` não conta (resolvido por `self.funcs`, não por valor). Usada tanto pelo parser (aproximação conservadora para decidir elegibilidade do caminho rápido da Fase 238/239) quanto pelo semantic (resolução real contra escopo léxico vigente na Fase 243) — a lista pode conter nomes que na resolução real não são captura alguma (função top-level, constante, variante de leque); cabe ao chamador filtrar."
expect_file = "src/ast.rs"
expect_domain = "closures"
expect_layer = "ast"

