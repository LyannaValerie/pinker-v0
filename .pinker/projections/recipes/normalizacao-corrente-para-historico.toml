[[rules]]
op = "override-region"
key = "build.elf.leitor"
from_hash = "fnv1a64:8fc3e153be74c858"
to_hash = "fnv1a64:8aad2bd74103f43b"
from_summary = "Leitor mínimo de ELF64 little-endian sem dependência externa: valida o magic `\\x7fELF`, a classe 64 bits, a ordem little-endian e a consistência de `e_shentsize`/`e_shoff`, resolve `e_shnum`/`e_shstrndx` inclusive nas formas estendidas (`shnum == 0` lê `sh_size` da seção 0 e `shstrndx == SHN_XINDEX` lê `sh_link`), coleta os nomes das seções pela `.shstrtab` junto de `sh_flags` (consultável por nome via `section_flags_of`/`section_is_non_executable`, de modo que uma seção possa ser distinguida de uma seção com permissão de execução) e percorre toda seção `SHT_SYMTAB` extraindo nome, ligação (`st_info >> 4`), tipo (`st_info & 0xf`), visibilidade (`st_other & 0x3`), índice de seção e tamanho de cada símbolo. Toda leitura é limitada por índice conferido contra o tamanho do buffer, de modo que um arquivo truncado ou malformado devolve `Err` com detalhe legível em vez de pânico; nenhum conteúdo de seção, relocação ou informação de depuração é interpretado. `parse_program_headers` lê a tabela de segmentos do mesmo arquivo: valida o mesmo prefixo, lê `e_phoff`/`e_phentsize`/`e_phnum`, resolve a forma estendida `PN_XNUM` (`e_phnum == 0xffff` lê `sh_info` da seção 0), exige `e_phentsize == 56` e devolve `(p_type, p_flags)` de cada segmento em `ElfProgramHeader`. Existe porque a `.note.GNU-stack` do objeto só é observável no executável final como `PT_GNU_STACK`, que vive na tabela de programa e não na de seções; um objeto relocável não tem essa tabela e devolve lista vazia, o que não é erro."
to_summary = "Leitor mínimo de ELF64 little-endian sem dependência externa: valida o magic `\\x7fELF`, a classe 64 bits, a ordem little-endian e a consistência de `e_shentsize`/`e_shoff`, resolve `e_shnum`/`e_shstrndx` inclusive nas formas estendidas (`shnum == 0` lê `sh_size` da seção 0 e `shstrndx == SHN_XINDEX` lê `sh_link`), coleta os nomes das seções pela `.shstrtab` e percorre toda seção `SHT_SYMTAB` extraindo nome, ligação (`st_info >> 4`), tipo (`st_info & 0xf`), visibilidade (`st_other & 0x3`), índice de seção e tamanho de cada símbolo. Toda leitura é limitada por índice conferido contra o tamanho do buffer, de modo que um arquivo truncado ou malformado devolve `Err` com detalhe legível em vez de pânico; nenhum conteúdo de seção, relocação ou informação de depuração é interpretado."
expect_file = "src/elf.rs"
expect_domain = "build"
expect_layer = "elf"

