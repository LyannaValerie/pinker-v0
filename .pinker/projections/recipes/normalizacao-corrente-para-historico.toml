[[rules]]
op = "override-region"
key = "backend-s.abi.blocos-terminadores"
from_hash = "fnv1a64:e8c61723dab7560c"
to_hash = "fnv1a64:48d71c0490589bff"
from_summary = "Emissão de blocos e terminadores do renderer montável: rótulos locais injetivos de `native_symbol::injective_local_label` (`.Lp<len>_<fn><len>_<bloco>`, prefixados por comprimento e portanto recuperáveis), corpo já textualizado linha a linha, e cada terminador — `Jmp` → `jmp`; `Br` carrega a condição (`load_operand` com `.expect`), `cmpq $0,%rax` + `jne`/`jmp`; `Ret` carrega o valor (`.expect`), `leave` e `ret`. Fecha a função com `.size`, exceto quando ela carrega envelope de `sussurro` — declarar o tamanho ali tornaria falso o invariante de artefato de D4, que compara o objeto real contra a baseline sem os envelopes. No fim, verifica o conjunto emitido: duas identidades distintas no mesmo símbolo viram diagnóstico Pinker determinístico em vez de erro cru do GNU as. Os `.expect` dependem de invariantes garantidas antes, no lowering (condição/retorno carregáveis). Encerra a unidade declarando `.section .note.GNU-stack,\"\",@progbits` uma única vez, depois de todas as seções executáveis e de dados: a unidade informa que não exige pilha executável, sem o que o assembler marca esse requisito por omissão e o linker o propaga para `PT_GNU_STACK` do executável final. A declaração pertence à unidade e não à função, e não toca rótulo, símbolo, `.size`, CFI ou alinhamento."
to_summary = "Emissão de blocos e terminadores do renderer montável: `jmp .L<fn>_entry`, rótulos `.L<fn>_<label>:`, corpo já textualizado linha a linha, e cada terminador — `Jmp` → `jmp`; `Br` carrega a condição (`load_operand` com `.expect`), `cmpq $0,%rax` + `jne`/`jmp`; `Ret` carrega o valor (`.expect`), `leave` e `ret`. Fecha a função e devolve o `.s`. Os `.expect` dependem de invariantes garantidas antes, no lowering (condição/retorno carregáveis)."
expect_file = "src/backend_s.rs"
expect_domain = "abi"
expect_layer = "backend-s"

[[rules]]
op = "override-region"
key = "backend-s.abi.prologo-parametros"
from_hash = "fnv1a64:854fcff9195bce72"
to_hash = "fnv1a64:5f4279cdbbc69fc2"
from_summary = "Prólogo e passagem de parâmetros do renderer montável: pede o símbolo e a ligação à autoridade única `native_symbol` (`principal` produz `main`, GLOBAL; toda outra definição é `.local`), emite a diretiva de ligação e `.type @function`, depois `pushq %rbp`/`movq %rsp,%rbp`, insere a chamada a `pinker_rt_iniciar` quando `runtime_init` e a identidade é a do entrypoint (pilha alinhada a 16 após o push), reserva o frame (`subq $stack_size,%rsp`), armazena os 6 primeiros parâmetros de `ARG_REGS` nos slots e carrega o 7º+ a partir de `16(%rbp)`. A única diferença observável entre os dois caminhos externos é essa chamada de runtime."
to_summary = "Prólogo e passagem de parâmetros do renderer montável: mapeia `principal` para o símbolo `main`, emite `pushq %rbp`/`movq %rsp,%rbp`, insere a chamada a `pinker_rt_iniciar` quando `runtime_init` e o símbolo é `main` (pilha alinhada a 16 após o push), reserva o frame (`subq $stack_size,%rsp`), armazena os 6 primeiros parâmetros de `ARG_REGS` nos slots e carrega o 7º+ a partir de `16(%rbp)`. A única diferença observável entre os dois caminhos externos é essa chamada de runtime."
expect_file = "src/backend_s.rs"
expect_domain = "abi"
expect_layer = "backend-s"

[[rules]]
op = "override-region"
key = "backend-s.lowering.chamadas-sysv"
from_hash = "fnv1a64:53fa5354c31fe7d3"
to_hash = "fnv1a64:9bcbd95ce8c3a26f"
from_summary = "Lowering de chamadas no corpo do bloco (ABI SysV): `Call` com destino trata `__ternario` puro por `cmoveq`; `formatar_verso` materializa um pack contíguo de handles `verso` na pilha e chama a autoridade única `pinker_formatar_verso_pack(modelo,count,entries)`; passagem dos 6 primeiros argumentos em `ARG_REGS`, empilhamento do 7º+ do último ao primeiro com padding de alinhamento e cleanup após o `call`. `Call` e `CallVoid` delegam a escolha do destino a `resolver_rota_de_chamada` e diferem apenas em `CallVoid` não guardar `%rax`. `CallVoid` passou a consultar também o despacho por aridade, que antes só o `Call` consultava: é por aí que `afirmar` alcança `pinker_afirmar_1`/`pinker_afirmar_2`, e para as demais intrínsecas de aridade variável o ramo é inalcançável porque a seleção só emite `CallVoid` para retorno `Nulo`. Aridade fora do recorte e callee desconhecido continuam recusados por esta camada."
to_summary = "Lowering de chamadas no corpo do bloco (ABI SysV): `Call` com destino trata `__ternario` de braços trivialmente puros como seleção por `cmpq`+`cmoveq`; ternários com efeitos já chegam como ramos CFG lazy. Demais chamadas resolvem intrínsecas por aridade (`runtime_intrinsic_symbol_por_aridade`) e por nome (`runtime_intrinsic_symbol`) ou chamam função Pinker por símbolo direto, passam os 6 primeiros argumentos em `ARG_REGS`, empilham o 7º+ do último ao primeiro com padding de alinhamento e limpam a pilha após o `call`, guardando `%rax` no slot de destino. Símbolo desconhecido é recusado."
expect_file = "src/backend_s.rs"
expect_domain = "lowering"
expect_layer = "backend-s"

